<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI助手 - LiteReport平台</title>
<link rel="stylesheet" href="/css/app.css?v=2">
<style>
  .ai-wrap { display: flex; gap: 16px; height: calc(100vh - 120px); min-height: 480px; }
  .ai-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ai-log { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .msg { display: flex; margin-bottom: 14px; gap: 10px; }
  .msg .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; font-size: 17px; color: #fff; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: #13A8A8; }
  .msg.assistant .avatar { background: #5b6b79; }
  .bubble { max-width: 72%; padding: 10px 14px; border-radius: 10px; line-height: 1.65;
    font-size: 14px; word-break: break-word; overflow-wrap: anywhere; }
  .msg.user .bubble { background: #e6f7f7; border: 1px solid #b5e8e8; }
  .msg.assistant .bubble { background: #f7f8fa; border: 1px solid #e8eaed; }
  .bubble pre { background: #282c34; color: #abb2bf; padding: 10px 12px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .bubble code.inline { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .ai-input-bar { border-top: 1px solid #eee; padding: 12px 18px; display: flex; gap: 10px; align-items: flex-end; }
  .ai-input-bar textarea { flex: 1; resize: none; height: 64px; border: 1px solid #d9dde2; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; }
  .ai-input-bar textarea:focus { border-color: #13A8A8; }
  .ai-side { width: 230px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .ai-side .card { padding: 12px; }
  .chip { display: block; width: 100%; text-align: left; background: #f7f8fa; border: 1px solid #e8eaed;
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: #13A8A8; color: #13A8A8; }
  .sess { position: relative; border: 1px solid #e8eaed; border-radius: 8px; padding: 8px 26px 8px 10px;
    margin-bottom: 8px; font-size: 13px; cursor: pointer; }
  .sess:hover { border-color: #13A8A8; }
  .sess.cur { border-color: #13A8A8; background: #e6f7f7; }
  .sess .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .m { color: #999; font-size: 11px; margin-top: 2px; }
  .sess .x { position: absolute; right: 6px; top: 6px; color: #bbb; cursor: pointer; }
  .sess .x:hover { color: #ff4d4f; }
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>

<div class="page">
  <div class="ai-wrap">
    <div class="card ai-main">
      <div class="ai-log" id="aiLog"></div>
      <div class="ai-input-bar">
        <textarea id="aiText" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="send()">发 送</button>
        <button class="btn" onclick="clearChat()" title="清空对话">🗑</button>
      </div>
    </div>
    <div class="ai-side">
      <div class="card">
        <b style="font-size:13px">会话列表</b>
        <button class="btn btn-primary btn-sm" style="width:100%;margin:8px 0" onclick="newSession()">＋ 新建会话</button>
        <div id="sessionList"></div>
      </div>
      <div class="card">
        <b style="font-size:13px">表结构上下文</b>
        <div class="mt8" style="display:flex;gap:6px">
          <select class="input" id="ctxDs" style="flex:1;font-size:12px" onchange="loadCtxTables()"><option value="">选择数据源…</option></select>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <select class="input" id="ctxTable" style="flex:1;font-size:12px"><option value="">选择数据表…</option></select>
          <button class="btn btn-sm" id="ctxBtn" style="font-size:12px" onclick="toggleCtx()">附加</button>
        </div>
        <p class="muted" style="font-size:12px;margin-top:6px">附加后 AI 将基于真实表结构回答（写 SQL 不再瞎编表名列名）。</p>
      </div>
      <div class="card">
        <b style="font-size:13px">快捷提问</b>
        <a class="chip mt8" onclick="quick(this)">写一个按性别分组统计人数的SQL</a>
        <a class="chip" onclick="quick(this)">解释一下：select * from sys_log where log_type='1'</a>
        <a class="chip" onclick="quick(this)">报表查询慢，帮我分析可能的原因</a>
        <a class="chip" onclick="quick(this)">如何设计一张员工考勤表？给出建表SQL</a>
      </div>
      <div class="card">
        <b style="font-size:13px">更多</b>
        <a class="chip mt8" onclick="location.href='/index.html?ai=1'">📝 AI生成报表</a>
        <a class="chip only-admin" onclick="openAISet()">⚙ AI设置</a>
        <p class="muted" style="font-size:12px;margin-top:8px">未配置时请在「AI设置」或 config.yaml 的 <code>ai:</code> 段填写模型接口。</p>
      </div>
    </div>
  </div>
</div>

<!-- AI 设置弹窗（admin） -->
<div class="mask" id="aiSetModal">
  <div class="modal narrow">
    <div class="modal-head"><span class="title">AI 设置</span>
      <button class="close" onclick="closeModal('aiSetModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-item mb12"><label>接口地址(base_url):</label>
        <input class="input" style="width:100%" id="sBase" placeholder="https://api.openai.com/v1"></div>
      <div class="form-item mb12"><label>模型:</label>
        <input class="input w-md mono" id="sModel" placeholder="gpt-4o-mini"></div>
      <div class="form-item mb12"><label>API Key:</label>
        <input type="password" class="input" style="width:100%" id="sKey" placeholder="留空表示沿用已保存的密钥">
        <p class="muted" id="sKeyTip" style="font-size:12px;margin-top:4px"></p></div>
      <p class="muted" style="font-size:12px">保存到元库后立即生效（优先于 config.yaml）；密钥 AES-GCM 加密存储。</p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('aiSetModal')">取消</button>
      <button class="btn btn-primary" onclick="saveAISet()">保 存</button>
    </div>
  </div>
</div>

<script src="/js/common.js?v=2"></script>
<script>
renderNav('AI助手');

var chatHistory = [];          // [{role, content}]，不含 system
var sessionId = genId();       // 当前会话标识（新会话首条消息后落库）
var busy = false;

function genId() {
  var s = Date.now().toString(36);
  for (var i = 0; i < 5; i++) s += Math.floor(Math.random() * 1679616).toString(36);
  return s;
}

// ───── 会话列表 ─────
function loadSessions(cur) {
  api('/api/ai/sessions').then(function (list) {
    var box = $('#sessionList');
    box.innerHTML = (list || []).map(function (c) {
      return '<div class="sess' + (c.sessionId === cur ? ' cur' : '') + '" data-id="' + esc(c.sessionId) + '">' +
        '<div class="t">' + esc(c.title) + '</div>' +
        '<div class="m">' + esc(c.lastTime) + ' · ' + c.count + '条</div>' +
        '<span class="x" data-id="' + esc(c.sessionId) + '" title="删除会话">✕</span>' +
        '</div>';
    }).join('') || '<p class="muted" style="font-size:12px">暂无历史会话</p>';
  }).catch(function () {});
}
$('#sessionList').addEventListener('click', function (e) {
  var x = e.target.closest('.x');
  if (x) {
    if (!confirm('删除该会话？')) return;
    api('/api/ai/history?session=' + encodeURIComponent(x.dataset.id), { method: 'DELETE' })
      .then(function () { loadSessions(sessionId); if (x.dataset.id === sessionId) newSession(); })
      .catch(function (er) { toast(er.message, 'error'); });
    return;
  }
  var item = e.target.closest('.sess');
  if (item && item.dataset.id !== sessionId) switchSession(item.dataset.id);
});

function switchSession(id) {
  sessionId = id;
  api('/api/ai/history?session=' + encodeURIComponent(id)).then(function (list) {
    chatHistory = (list || []).map(function (m) { return { role: m.role, content: m.content }; });
    var log = $('#aiLog');
    log.innerHTML = '';
    (list || []).forEach(function (m) { addMsg(m.role === 'user' ? 'user' : 'assistant', m.content); });
    if (!list || !list.length) showWelcome();
    loadSessions(sessionId);
  }).catch(function (e) { toast(e.message, 'error'); });
}

function newSession() {
  sessionId = genId();
  chatHistory = [];
  showWelcome();
  loadSessions(sessionId);
  $('#aiText').focus();
}

// GFM 管道表格 → HTML 表格（流式时最后一行未闭合会先按文本渲染，行齐后自动成表）
function renderTables(html) {
  var lines = html.split('\n');
  var isRow = function (l) { l = l.trim(); return l.charAt(0) === '|' && l.charAt(l.length - 1) === '|'; };
  var isSep = function (l) {
    l = l.trim();
    return l.charAt(0) === '|' && /^\|[\s:|-]+\|?$/.test(l) && l.indexOf('-') >= 0;
  };
  var cells = function (l) {
    var parts = l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
    return parts.map(function (x) { return x.trim(); });
  };
  var out = [], i = 0;
  while (i < lines.length) {
    if (isRow(lines[i]) && i + 1 < lines.length && isSep(lines[i + 1])) {
      var head = cells(lines[i]);
      i += 2;
      var rows = [];
      while (i < lines.length && isRow(lines[i])) { rows.push(cells(lines[i])); i++; }
      var h = '<div class="tbl-wrap"><table class="md"><tr>';
      head.forEach(function (c) { h += '<th>' + c + '</th>'; });
      h += '</tr>';
      rows.forEach(function (r) {
        h += '<tr>';
        head.forEach(function (_, ci) { h += '<td>' + (r[ci] || '') + '</td>'; });
        h += '</tr>';
      });
      out.push(h + '</table></div>');
      continue;
    }
    out.push(lines[i]);
    i++;
  }
  return out.join('\n');
}

function renderMarkdown(text) {
  var html = esc(text);
  var blocks = [];
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
    blocks.push('<pre><code>' + code.replace(/\n+$/, '') + '</code></pre>');
    return '␀' + (blocks.length - 1) + '␀';
  });
  html = renderTables(html);
  html = html.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/␀(\d+)␀/g, function (_, i) { return blocks[+i]; });
  return html;
}

function addMsg(role, text) {
  var log = $('#aiLog');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML =
    '<div class="avatar">' + (role === 'user' ? '👤' : '🤖') + '</div>' +
    '<div class="bubble">' + renderMarkdown(text) + '</div>';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function showWelcome() {
  $('#aiLog').innerHTML =
    '<div class="msg assistant"><div class="avatar">🤖</div><div class="bubble">' +
    '你好，我是 LiteReport AI助手 🤖<br>可以帮你写 SQL、分析查询性能、设计表结构，或解答平台使用问题。' +
    '</div></div>';
}

function quick(el) { $('#aiText').value = el.textContent.trim(); send(); }

function clearChat() {
  chatHistory = [];
  showWelcome();
  api('/api/ai/history?session=' + encodeURIComponent(sessionId), { method: 'DELETE' })
    .then(function () { loadSessions(sessionId); })
    .catch(function () {});
}

function saveHistoryScroll() { var log = $('#aiLog'); log.scrollTop = log.scrollHeight; }

// ───── 流式发送（SSE）─────
function send() {
  if (busy) return;
  var box = $('#aiText');
  var text = box.value.trim();
  if (!text) { toast('请输入问题', 'error'); return; }
  busy = true;
  $('#sendBtn').disabled = true;
  box.value = '';
  addMsg('user', text);
  var sent = ctxSchema ? '参考以下真实表结构回答（表名/列名以此为准）：\n\n' + ctxSchema + '\n\n问题：' + text : text;
  chatHistory.push({ role: 'user', content: sent });
  var bubble = addMsg('assistant', '思考中...');
  saveHistoryScroll();

  fetch('/api/ai/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json;charset=utf-8' },
    body: JSON.stringify({ sessionId: sessionId, messages: chatHistory })
  }).then(function (res) {
    if (res.status === 401) { location.href = '/login.html'; throw new Error('未登录'); }
    if (!res.ok || (res.headers.get('content-type') || '').indexOf('text/event-stream') < 0) {
      throw new Error('服务异常(HTTP ' + res.status + ')');
    }
    return res.body.getReader();
  }).then(function (reader) {
    var decoder = new TextDecoder();
    var acc = '';
    var buf = '';
    var apply = function (obj) {
      if (obj.delta) { acc += obj.delta; bubble.querySelector('.bubble').innerHTML = renderMarkdown(acc); saveHistoryScroll(); }
      if (obj.error) { acc += '\n\n⚠ ' + obj.error; bubble.querySelector('.bubble').innerHTML = renderMarkdown(acc); }
    };
    var pump = function () {
      return reader.read().then(function (r) {
        if (r.done) return;
        buf += decoder.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          var frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          frame.split('\n').forEach(function (line) {
            if (line.indexOf('data:') !== 0) return;
            var payload = line.slice(5).trim();
            if (!payload) return;
            try { apply(JSON.parse(payload)); } catch (e) {}
          });
        }
        return pump();
      });
    };
    return pump().then(function () {
      if (acc) {
        chatHistory.push({ role: 'assistant', content: acc });
        loadSessions(sessionId);
      } else { bubble.remove(); chatHistory.pop(); toast('AI未返回内容', 'error'); }
    });
  }).catch(function (e) {
    bubble.querySelector('.bubble').innerHTML = renderMarkdown('⚠ ' + e.message);
    chatHistory.pop();
  }).finally(function () {
    busy = false;
    $('#sendBtn').disabled = false;
    box.focus();
  });
}

$('#aiText').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ───── 表结构上下文 ─────
var ctxSchema = '';   // 附加的表结构文本
var ctxLabel = '';

(function initCtx() {
  api('/api/datasource/list').then(function (list) {
    $('#ctxDs').innerHTML = '<option value="">选择数据源…</option>' +
      (list || []).map(function (d) { return '<option value="' + esc(d.key) + '">' + esc(d.name) + '</option>'; }).join('');
  }).catch(function () {
    // viewer 无数据源权限，隐藏上下文区块
    $('#ctxDs').closest('.card').style.display = 'none';
  });
})();

function loadCtxTables() {
  var key = $('#ctxDs').value;
  ctxSchema = ''; ctxLabel = ''; $('#ctxBtn').textContent = '附加';
  $('#ctxTable').innerHTML = '<option value="">选择数据表…</option>';
  if (!key) return;
  api('/api/datasource/tables?key=' + encodeURIComponent(key)).then(function (tables) {
    $('#ctxTable').innerHTML = '<option value="">选择数据表…</option>' +
      (tables || []).map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
  }).catch(function (e) { toast(e.message, 'error'); });
}

function toggleCtx() {
  if (ctxSchema) { ctxSchema = ''; ctxLabel = ''; $('#ctxBtn').textContent = '附加'; return; }
  var ds = $('#ctxDs').value, tb = $('#ctxTable').value;
  if (!ds || !tb) { toast('请先选择数据源和数据表', 'error'); return; }
  api('/api/datasource/columns?key=' + encodeURIComponent(ds) + '&table=' + encodeURIComponent(tb)).then(function (cols) {
    var lines = (cols || []).map(function (c) { return '- ' + c.name + ' (' + c.type + ')'; });
    if (!lines.length) { toast('未读取到字段', 'error'); return; }
    ctxSchema = '数据源[' + ds + '] 数据表 ' + tb + ' 的字段:\n' + lines.join('\n');
    ctxLabel = ds + '.' + tb;
    $('#ctxBtn').textContent = '移除';
    toast('已附加 ' + ctxLabel + '（' + lines.length + ' 个字段）', 'success');
  }).catch(function (e) { toast(e.message, 'error'); });
}

// ───── 初始加载：会话列表；默认切到最近会话 ─────
loadSessions(sessionId);
api('/api/ai/sessions').then(function (list) {
  if (list && list.length) switchSession(list[0].sessionId);
  else showWelcome();
}).catch(function () { showWelcome(); });

// ───── AI 设置（admin）─────
function openAISet() {
  api('/api/ai/config').then(function (c) {
    $('#sBase').value = c.baseUrl || '';
    $('#sModel').value = c.model || '';
    $('#sKey').value = '';
    $('#sKeyTip').textContent = c.hasKey ? '已配置密钥（' + (c.source === 'db' ? '元库' : 'config.yaml') + '），留空沿用' : '尚未配置密钥';
    openModal('aiSetModal');
  }).catch(function (e) { toast(e.message, 'error'); });
}
function saveAISet() {
  var body = {
    baseUrl: $('#sBase').value.trim(),
    model: $('#sModel').value.trim(),
    apiKey: $('#sKey').value.trim()
  };
  api('/api/ai/config', { method: 'POST', body: body }).then(function () {
    toast('已保存，立即生效', 'success'); closeModal('aiSetModal');
  }).catch(function (e) { toast(e.message, 'error'); });
}
</script>
</body>
</html>
