<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - LiteReport平台</title>
<link rel="stylesheet" href="/css/app.css?v=2">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: linear-gradient(135deg, #0e7c7c 0%, #13a8a8 60%, #2bd9c9 100%); }
  .login-card { background: #fff; border-radius: 10px; padding: 40px 44px; width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .login-card h1 { font-size: 22px; color: var(--primary); margin-bottom: 4px; }
  .login-card .sub { color: var(--text-2); font-size: 13px; margin-bottom: 26px; }
  .login-card label { display: block; margin: 14px 0 6px; font-size: 13px; }
  .login-card input { width: 100%; height: 38px; border: 1px solid #d9d9d9; border-radius: 5px;
    padding: 0 12px; font-size: 14px; outline: none; }
  .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(19,168,168,.15); }
  .login-card .btn { width: 100%; height: 40px; margin-top: 24px; justify-content: center; font-size: 15px; }
  .login-card .tip { margin-top: 16px; font-size: 12px; color: var(--text-2); text-align: center; }
</style>
</head>
<body>
  <div class="login-card">
    <h1>LiteReport</h1>
    <div class="sub">轻在线报表平台 · 请登录</div>
    <label>用户名</label>
    <input id="username" autocomplete="username" placeholder="用户名">
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="密码"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登 录</button>
  </div>
<script>
function qs(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
function doLogin() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  if (!u || !p) { alert('请输入用户名和密码'); return; }
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json;charset=utf-8' },
    body: JSON.stringify({ username: u, password: p })
  }).then(function (res) { return res.json(); }).then(function (r) {
    if (r.success) {
      var next = qs('next');
      // 仅允许站内相对路径（单个 / 开头），防开放重定向
      location.href = (next && next.charAt(0) === '/' && next.charAt(1) !== '/' && next.indexOf('\\') < 0) ? next : '/';
      return;
    }
    throw new Error(r.message || '登录失败');
  }).catch(function (e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = '登 录';
  });
}
</script>
</body>
</html>
